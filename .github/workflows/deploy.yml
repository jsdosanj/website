name: Deploy
# Replaces the git-connected Cloudflare Pages build that used to run on every
# merge to main. Pages built Astro's `dist/`; there is no `dist/` any more, so
# the deploy moved here: OpenNext compiles the Next build into a Worker and
# wrangler ships it.
#
# It needs two repository secrets, and does nothing until they exist:
#
#   CLOUDFLARE_API_TOKEN   — a token with "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  — the account the Worker lives in
#
# Without them the job reports a notice and passes, so merging never shows a
# red X for a deploy that was never configured.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and let a newer commit supersede an in-flight one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository secrets to enable deploys."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
        if: steps.creds.outputs.ready == 'true'

      - name: Build and deploy the Worker
        if: steps.creds.outputs.ready == 'true'
        run: npm run deploy
