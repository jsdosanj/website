name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The design system makes checkable claims — AA contrast on every text
      # colour, a 44pt floor on every control, no horizontal overflow at 200%
      # text, motion fully optional. scripts/audit/ verifies them against the
      # real rendered pages, so a regression fails the PR rather than shipping.
      - name: Install Chromium for the design audit
        run: npx playwright install --with-deps chromium

      - name: Design audit
        run: npm run audit
